<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Vector</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;cursor:none}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// ─── Canvas ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0;

// ─── World ────────────────────────────────────────────────────────────────────
const GS      = 44;          // grid spacing
const GCOLS   = 44;          // grid cols  (half of original 88)
const GROWS   = 25;          // grid rows  (half of original 50)
const WORLD_W = GCOLS * GS;  // 1936
const WORLD_H = GROWS * GS;  // 1100

// ─── Camera (world-space, top-left of viewport) ────────────────────────────
let camX = 0, camY = 0;

// ─── Input ────────────────────────────────────────────────────────────────────
const keys  = Object.create(null);
const mouse = { x: 0, y: 0, down: false };

window.addEventListener('keydown',   e => { keys[e.code] = true; if(e.code==='KeyM') toggleMute(); e.preventDefault(); });
window.addEventListener('keyup',     e => { keys[e.code] = false; });
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', e => { if(e.button===0){mouse.down=true;} e.preventDefault(); });
canvas.addEventListener('mouseup',   e => { if(e.button===0) mouse.down=false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

function resize() {
  W = canvas.width  = Math.max(480, document.documentElement.clientWidth  || window.innerWidth  || 800);
  H = canvas.height = Math.max(320, document.documentElement.clientHeight || window.innerHeight || 600);
  if(grid) grid.resize();
  _resizeGL();
}
window.addEventListener('resize', resize);
// Defer initial resize to ensure layout is computed
setTimeout(resize, 0);

// ─── Math ─────────────────────────────────────────────────────────────────────
const TAU   = Math.PI * 2;
const rand  = (a,b) => a + Math.random()*(b-a);
const rInt  = (a,b) => (a + Math.random()*(b-a))|0;
const clamp = (v,lo,hi) => v<lo?lo:v>hi?hi:v;
const hypot = (dx,dy) => Math.sqrt(dx*dx+dy*dy);

// ─── Grid ─────────────────────────────────────────────────────────────────────
class Grid {
  constructor() {
    const n = (GCOLS+1)*(GROWS+1);
    this.px = new Float32Array(n);
    this.py = new Float32Array(n);
    this.vx = new Float32Array(n);
    this.vy = new Float32Array(n);
    for(let r=0;r<=GROWS;r++)
      for(let c=0;c<=GCOLS;c++){
        const i=r*(GCOLS+1)+c;
        this.px[i]=c*GS; this.py[i]=r*GS;
      }
  }

  push(wx,wy,strength,radius=140){
    const rr=radius*radius, n1=GCOLS+1;
    for(let r=0;r<=GROWS;r++)
      for(let c=0;c<=GCOLS;c++){
        const i=r*n1+c;
        const dx=this.px[i]-wx, dy=this.py[i]-wy;
        const d2=dx*dx+dy*dy;
        if(d2<rr && d2>0.001){
          const d=Math.sqrt(d2), f=strength*(1-d/radius);
          this.vx[i]+=dx/d*f; this.vy[i]+=dy/d*f;
        }
      }
  }

  update(dt){
    const n1=GCOLS+1, m1=GROWS+1, s=60*dt;
    for(let r=0;r<m1;r++)
      for(let c=0;c<n1;c++){
        const i=r*n1+c;
        this.vx[i]+=(c*GS-this.px[i])*0.07;
        this.vy[i]+=(r*GS-this.py[i])*0.07;
        this.vx[i]*=0.955; this.vy[i]*=0.955;
        this.px[i]+=this.vx[i]*s; this.py[i]+=this.vy[i]*s;
      }
    // Wave propagation
    for(let pass=0;pass<3;pass++)
      for(let r=0;r<m1;r++)
        for(let c=0;c<n1;c++){
          const i=r*n1+c;
          if(c<n1-1){
            const j=i+1;
            let d=(this.vx[i]-this.vx[j])*0.018;
            this.vx[i]-=d; this.vx[j]+=d;
            d=(this.vy[i]-this.vy[j])*0.018;
            this.vy[i]-=d; this.vy[j]+=d;
          }
          if(r<m1-1){
            const j=i+n1;
            let d=(this.vx[i]-this.vx[j])*0.018;
            this.vx[i]-=d; this.vx[j]+=d;
            d=(this.vy[i]-this.vy[j])*0.018;
            this.vy[i]-=d; this.vy[j]+=d;
          }
        }
  }

  // Batched segment renderer — groups segments into displacement bins
  // so we call stroke() BINS*2 times instead of once per segment
  draw(){
    const n1=GCOLS+1;
    const c0=Math.max(0, Math.floor(camX/GS)-1);
    const c1=Math.min(GCOLS-1, Math.ceil((camX+W)/GS)+1);
    const r0=Math.max(0, Math.floor(camY/GS)-1);
    const r1=Math.min(GROWS-1, Math.ceil((camY+H)/GS)+1);

    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.lineCap='round';

    // 8 displacement bins → at most 16 stroke() calls total (vs 4400+ before)
    const BINS=8;
    const thin=[], glow=[];
    for(let b=0;b<BINS;b++){ thin.push([]); glow.push([]); }

    const addSeg=(x1,y1,x2,y2,disp)=>{
      const t=Math.min(1,disp/22);
      const b=Math.min(BINS-1,t*BINS|0);
      const sx1=x1-camX,sy1=y1-camY,sx2=x2-camX,sy2=y2-camY;
      thin[b].push(sx1,sy1,sx2,sy2);
      if(t>0.22) glow[b].push(sx1,sy1,sx2,sy2);
    };

    // Horizontal
    for(let r=r0;r<=r1+1;r++)
      for(let c=c0;c<=c1;c++){
        const i1=r*n1+c, i2=i1+1;
        const d1=hypot(this.px[i1]-c*GS,   this.py[i1]-r*GS);
        const d2=hypot(this.px[i2]-(c+1)*GS,this.py[i2]-r*GS);
        addSeg(this.px[i1],this.py[i1],this.px[i2],this.py[i2],(d1+d2)*0.5);
      }
    // Vertical
    for(let c=c0;c<=c1+1;c++)
      for(let r=r0;r<=r1;r++){
        const i1=r*n1+c, i2=i1+n1;
        const d1=hypot(this.px[i1]-c*GS, this.py[i1]-r*GS);
        const d2=hypot(this.px[i2]-c*GS, this.py[i2]-(r+1)*GS);
        addSeg(this.px[i1],this.py[i1],this.px[i2],this.py[i2],(d1+d2)*0.5);
      }

    // Batch draw — one stroke() per bin per pass
    for(let b=0;b<BINS;b++){
      const t=(b+0.5)/BINS;
      const rv=(15+t*130)|0, gv=(25+t*190)|0, bv=(160+t*95)|0;
      const tp=thin[b];
      if(tp.length){
        ctx.strokeStyle=`rgba(${rv},${gv},${bv},${(0.10+t*0.62).toFixed(2)})`;
        ctx.lineWidth=1+t*1.8;
        ctx.beginPath();
        for(let i=0;i<tp.length;i+=4){ ctx.moveTo(tp[i],tp[i+1]); ctx.lineTo(tp[i+2],tp[i+3]); }
        ctx.stroke();
      }
      const gp=glow[b];
      if(gp.length){
        ctx.strokeStyle=`rgba(${rv},${gv},${bv},${(t*0.11).toFixed(3)})`;
        ctx.lineWidth=7+t*9;
        ctx.beginPath();
        for(let i=0;i<gp.length;i+=4){ ctx.moveTo(gp[i],gp[i+1]); ctx.lineTo(gp[i+2],gp[i+3]); }
        ctx.stroke();
      }
    }

    ctx.restore();
  }
}

// ─── Particles ────────────────────────────────────────────────────────────────
const MAX_P = 3500;
const pool  = new Array(MAX_P);
for(let i=0;i<MAX_P;i++) pool[i]={life:0};
let pActive = 0;

function _addParticle(wx,wy,vx,vy,r,g,b,size,decay,friction=0.97){
  if(pActive>=MAX_P) return;
  const p=pool[pActive++];
  p.wx=wx; p.wy=wy; p.vx=vx; p.vy=vy;
  p.r=r; p.g=g; p.b=b;
  p.size=size; p.life=1; p.decay=decay; p.friction=friction;
}

function spawnBurst(wx,wy,hex,count,sMin=80,sMax=320,szMin=1.5,szMax=5){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  for(let i=0;i<count;i++){
    const sp=rand(sMin,sMax), a=rand(0,TAU);
    _addParticle(wx,wy, Math.cos(a)*sp, Math.sin(a)*sp,
                 r,g,b, rand(szMin,szMax), rand(0.4,1.2), 0.970);
  }
}

// Fast long-range streamer shards — low friction so they shoot far across the screen
function spawnShards(wx,wy,hex,count=18,spMin=380,spMax=900){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  for(let i=0;i<count;i++){
    const sp=rand(spMin,spMax), a=rand(0,TAU);
    // Low decay (long life) + low friction (barely slows down) = travels far
    _addParticle(wx,wy, Math.cos(a)*sp, Math.sin(a)*sp,
                 r,g,b, rand(1.0,2.8), rand(0.38,0.75), 0.986);
  }
}

// Uniform ring blast (shockwave feel)
function spawnRing(wx,wy,hex,count=36,spMin=200,spMax=380){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  for(let i=0;i<count;i++){
    const a=(i/count)*TAU;
    const sp=rand(spMin,spMax);
    _addParticle(wx,wy, Math.cos(a)*sp, Math.sin(a)*sp,
                 r,g,b, rand(2,5), rand(0.45,0.85), 0.980);
  }
}

function spawnTrail(wx,wy,hex,sz=2){
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  _addParticle(wx,wy, rand(-15,15), rand(-15,15),
               r,g,b, sz, rand(2.5,6));
}

function updateParticles(dt){
  for(let i=pActive-1;i>=0;i--){
    const p=pool[i];
    p.wx+=p.vx*dt; p.wy+=p.vy*dt;
    p.vx*=p.friction; p.vy*=p.friction;
    p.life-=p.decay*dt;
    if(p.life<=0) pool[i]=pool[--pActive];
  }
}

// ─── WebGL Particle Renderer ──────────────────────────────────────────────────
// Replaces 3-pass × 3500 arc() calls with ONE gl.drawArrays() call.
const _glc = document.createElement('canvas');
let _gl=null, _glProg=null, _glBuf=null, _glVerts=null;
let _glResLoc=null, _glLp=-1, _glLs=-1, _glLc=-1;

(function initGL(){
  try{
    _gl=_glc.getContext('webgl',{alpha:true,premultipliedAlpha:false,antialias:false,preserveDrawingBuffer:true});
    if(!_gl) return;
    const gl=_gl;
    const vs=`attribute vec2 ap;attribute float asz;attribute vec4 ac;varying vec4 vc;uniform vec2 ur;void main(){vec2 cl=ap/ur*2.0-1.0;gl_Position=vec4(cl.x,-cl.y,0,1);gl_PointSize=asz;vc=ac;}`;
    const fs=`precision mediump float;varying vec4 vc;void main(){float d=length(gl_PointCoord-vec2(.5))*2.;if(d>1.)discard;float a=pow(1.-d,2.)*vc.a;gl_FragColor=vec4(vc.rgb*a,a);}`;
    function mkS(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;}
    _glProg=gl.createProgram();
    gl.attachShader(_glProg,mkS(gl.VERTEX_SHADER,vs));
    gl.attachShader(_glProg,mkS(gl.FRAGMENT_SHADER,fs));
    gl.linkProgram(_glProg);
    _glBuf=gl.createBuffer();
    _glVerts=new Float32Array(MAX_P*2*7); // 2 points/particle (halo+core), 7 floats each
    _glResLoc=gl.getUniformLocation(_glProg,'ur');
    _glLp=gl.getAttribLocation(_glProg,'ap');
    _glLs=gl.getAttribLocation(_glProg,'asz');
    _glLc=gl.getAttribLocation(_glProg,'ac');
  }catch(e){_gl=null;console.warn('WebGL unavailable, using Canvas 2D particles');}
})();

// Re-bind all GL state — MUST be called after canvas resize (resize resets GL context!)
function _glBindState(){
  if(!_gl) return;
  const gl=_gl;
  gl.useProgram(_glProg);
  gl.bindBuffer(gl.ARRAY_BUFFER,_glBuf);
  const stride=7*4;
  gl.enableVertexAttribArray(_glLp); gl.enableVertexAttribArray(_glLs); gl.enableVertexAttribArray(_glLc);
  gl.vertexAttribPointer(_glLp,2,gl.FLOAT,false,stride,0);
  gl.vertexAttribPointer(_glLs,1,gl.FLOAT,false,stride,8);
  gl.vertexAttribPointer(_glLc,4,gl.FLOAT,false,stride,12);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
}

function _resizeGL(){
  if(!_gl) return;
  _glc.width=W; _glc.height=H;      // ← resets GL context!
  _glBindState();                     // ← restore all state
  _gl.viewport(0,0,W,H);
  _gl.uniform2f(_glResLoc,W,H);
}

function drawParticles(){
  if(_gl && pActive>0){ _drawGL(); return; }
  // ── Canvas 2D fallback ──────────────────────────────────────────────────────
  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.shadowBlur=0;
  for(let i=0;i<pActive;i++){
    const p=pool[i]; const sx=p.wx-camX,sy=p.wy-camY;
    if(sx<-80||sx>W+80||sy<-80||sy>H+80) continue;
    const sz=p.size*p.life; if(sz<0.4) continue;
    ctx.globalAlpha=p.life*0.09; ctx.fillStyle=`rgb(${p.r},${p.g},${p.b})`;
    ctx.beginPath(); ctx.arc(sx,sy,sz*7,0,TAU); ctx.fill();
    ctx.globalAlpha=p.life*0.28;
    ctx.beginPath(); ctx.arc(sx,sy,sz*2.8,0,TAU); ctx.fill();
    ctx.globalAlpha=p.life*0.88; ctx.fillStyle=`rgb(${Math.min(255,p.r+70)},${Math.min(255,p.g+70)},${Math.min(255,p.b+70)})`;
    ctx.beginPath(); ctx.arc(sx,sy,sz,0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1; ctx.restore();
}

function _drawGL(){
  const gl=_gl;
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  let vi=0;
  // Halo pass: large soft bloom
  for(let i=0;i<pActive;i++){
    const p=pool[i]; const sx=p.wx-camX,sy=p.wy-camY;
    if(sx<-100||sx>W+100||sy<-100||sy>H+100) continue;
    const sz=p.size*p.life; if(sz<0.4) continue;
    _glVerts[vi++]=sx; _glVerts[vi++]=sy; _glVerts[vi++]=sz*8.5;
    _glVerts[vi++]=p.r/255; _glVerts[vi++]=p.g/255; _glVerts[vi++]=p.b/255; _glVerts[vi++]=p.life*0.14;
  }
  // Core pass: bright + whitened
  for(let i=0;i<pActive;i++){
    const p=pool[i]; const sx=p.wx-camX,sy=p.wy-camY;
    if(sx<-20||sx>W+20||sy<-20||sy>H+20) continue;
    const sz=p.size*p.life; if(sz<=0) continue;
    _glVerts[vi++]=sx; _glVerts[vi++]=sy; _glVerts[vi++]=sz*3.2;
    _glVerts[vi++]=Math.min(1,p.r/255+0.28); _glVerts[vi++]=Math.min(1,p.g/255+0.28);
    _glVerts[vi++]=Math.min(1,p.b/255+0.28); _glVerts[vi++]=p.life*0.92;
  }
  if(vi===0) return;
  gl.bufferData(gl.ARRAY_BUFFER,_glVerts.subarray(0,vi),gl.DYNAMIC_DRAW);
  gl.drawArrays(gl.POINTS,0,vi/7);
  // Blit onto main canvas with additive blending
  ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.drawImage(_glc,0,0); ctx.restore();
}

// ─── Audio ────────────────────────────────────────────────────────────────────
// BGM: 8-step / 132 BPM electronic beat (kick + snare + hat + sawtooth bass + triangle arp)
// SFX: shoot, enemy-shoot, explosion (sm/lg), player-death, black-hole-hit, event-sting
let _ac=null, _bgmG=null, _sfxG=null;
let _bgmTime=0, _bgmStep=0, _bgmTid=null, _bgmOn=false;
let _arpI=0, _lastShot=0, _muted=false;
const _BPM=132, _S=60/_BPM/2;  // 8th-note duration ≈ 0.2273 s
const _ARP=[60,63,67,70,72,70,67,63, 60,63,67,72,70,67,63,60]; // C-minor arp (2 bars)

function _midi(n){ return 440*Math.pow(2,(n-69)/12); }

function _initAudio(){
  if(_ac) return;
  try{
    _ac=new(window.AudioContext||window.webkitAudioContext)();
    _bgmG=_ac.createGain(); _bgmG.gain.value=0.42; _bgmG.connect(_ac.destination);
    _sfxG=_ac.createGain(); _sfxG.gain.value=0.82; _sfxG.connect(_ac.destination);
    // Play silent buffer — unlocks audio on iOS Safari and Chrome autoplay policy
    const buf=_ac.createBuffer(1,1,22050);
    const src=_ac.createBufferSource(); src.buffer=buf;
    src.connect(_ac.destination); src.start(0);
  }catch(e){ _ac=null; }
}
function _resumeAC(){ if(_ac&&_ac.state==='suspended') _ac.resume(); }

// Shared white-noise buffer (1 s, allocated once)
let _nBuf=null;
function _noise(){
  if(!_nBuf){
    const n=_ac.sampleRate;
    _nBuf=_ac.createBuffer(1,n,n);
    const d=_nBuf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  }
  return _nBuf;
}

// ── BGM instruments ───────────────────────────────────────────────────────────
function _kick(t){
  const o=_ac.createOscillator(), g=_ac.createGain();
  o.connect(g); g.connect(_bgmG);
  o.frequency.setValueAtTime(110,t);
  o.frequency.exponentialRampToValueAtTime(0.01,t+0.30);
  g.gain.setValueAtTime(1.1,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.30);
  o.start(t); o.stop(t+0.31);
}
function _snare(t){
  const s=_ac.createBufferSource(), f=_ac.createBiquadFilter(), g=_ac.createGain();
  s.buffer=_noise(); f.type='bandpass'; f.frequency.value=2200; f.Q.value=0.6;
  s.connect(f); f.connect(g); g.connect(_bgmG);
  g.gain.setValueAtTime(0.40,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.13);
  s.start(t); s.stop(t+0.14);
}
function _hat(t,open){
  const s=_ac.createBufferSource(), f=_ac.createBiquadFilter(), g=_ac.createGain();
  s.buffer=_noise(); f.type='highpass'; f.frequency.value=10000;
  s.connect(f); f.connect(g); g.connect(_bgmG);
  const d=open?0.10:0.025;
  g.gain.setValueAtTime(0.10,t); g.gain.exponentialRampToValueAtTime(0.001,t+d);
  s.start(t); s.stop(t+d+0.01);
}
function _bassNote(t,note){
  const o=_ac.createOscillator(), f=_ac.createBiquadFilter(), g=_ac.createGain();
  o.type='sawtooth'; o.frequency.value=_midi(note);
  f.type='lowpass'; f.frequency.setValueAtTime(800,t);
  f.frequency.exponentialRampToValueAtTime(180,t+_S*1.5); f.Q.value=12;
  o.connect(f); f.connect(g); g.connect(_bgmG);
  g.gain.setValueAtTime(0.55,t); g.gain.exponentialRampToValueAtTime(0.001,t+_S*1.8);
  o.start(t); o.stop(t+_S*2);
}
function _arpNote(t,note){
  const o=_ac.createOscillator(), g=_ac.createGain();
  o.type='triangle'; o.frequency.value=_midi(note);
  o.connect(g); g.connect(_bgmG);
  g.gain.setValueAtTime(0.070,t); g.gain.exponentialRampToValueAtTime(0.001,t+_S*0.55);
  o.start(t); o.stop(t+_S*0.6);
}

// ── BGM scheduler (150 ms lookahead, 40 ms poll) ──────────────────────────────
function _bgmTick(){
  if(!_bgmOn||!_ac) return;
  while(_bgmTime<_ac.currentTime+0.15){
    const s=_bgmStep%8, t=_bgmTime;
    _hat(t, s===0||s===4);            // hat every step; open on beats 1 & 3
    if(s===0||s===4||s===5) _kick(t); // kick beats 1,3 + extra "3-and" for drive
    if(s===2||s===6) _snare(t);       // snare beats 2 & 4
    if(s===0)      _bassNote(t,36);   // C2
    else if(s===2) _bassNote(t,43);   // G2
    else if(s===4) _bassNote(t,36);   // C2
    else if(s===6) _bassNote(t,39);   // Eb2
    _arpNote(t,_ARP[_arpI%_ARP.length]); _arpI++;
    _bgmTime+=_S; _bgmStep++;
  }
  _bgmTid=setTimeout(_bgmTick,40);
}
function startBGM(){
  if(!_ac||_bgmOn) return;
  _bgmOn=true; _bgmTime=_ac.currentTime+0.05; _bgmStep=0; _arpI=0;
  _bgmTick();
}
function stopBGM(){ _bgmOn=false; clearTimeout(_bgmTid); _bgmTid=null; }
function toggleMute(){
  _muted=!_muted;
  if(_bgmG) _bgmG.gain.value=_muted?0:0.42;
  if(_sfxG) _sfxG.gain.value=_muted?0:0.82;
}

// ── SFX ───────────────────────────────────────────────────────────────────────
function sfxShoot(){
  if(!_ac) return;
  const t=_ac.currentTime;
  if(t-_lastShot<0.065) return; _lastShot=t;
  const o=_ac.createOscillator(), g=_ac.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(900,t); o.frequency.exponentialRampToValueAtTime(1600,t+0.05);
  o.connect(g); g.connect(_sfxG);
  g.gain.setValueAtTime(0.22,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.07);
  o.start(); o.stop(t+0.08);
}
function sfxEnemyShoot(){

// ─── Bullets ──────────────────────────────────────────────────────────────────
class Bullet{
  constructor(wx,wy,vx,vy){
    this.wx=wx; this.wy=wy; this.vx=vx; this.vy=vy;
    this.alive=true; this.ttl=1.8;
    this.trail=[];
  }
  update(dt){
    this.trail.unshift({wx:this.wx,wy:this.wy});
    if(this.trail.length>10) this.trail.pop();
    this.wx+=this.vx*dt; this.wy+=this.vy*dt;
    this.ttl-=dt;
    if(this.wx<0||this.wx>WORLD_W||this.wy<0||this.wy>WORLD_H||this.ttl<=0)
      this.alive=false;
    // Dense bullet trail — every frame, multiple sparks
    spawnTrail(this.wx,this.wy,'#ffff44',rand(1.5,3.0));
    spawnTrail(this.wx,this.wy,'#ffffff',rand(0.8,1.6));
    if(Math.random()<0.4) spawnTrail(this.wx,this.wy,'#ffcc00',rand(1,2.5));
  }
  draw(){
    const sx=this.wx-camX, sy=this.wy-camY;
    if(sx<-30||sx>W+30||sy<-30||sy>H+30) return;
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<this.trail.length;i++){
      const t=1-i/this.trail.length;
      const tx=this.trail[i].wx-camX, ty=this.trail[i].wy-camY;
      ctx.globalAlpha=t*0.28; ctx.fillStyle='#ffee44';
      ctx.beginPath(); ctx.arc(tx,ty,2.5*t,0,TAU); ctx.fill();
    }
    ctx.globalAlpha=1;
    // Glow via multi-stroke (no shadowBlur)
    ctx.fillStyle='rgba(255,240,0,0.06)';
    ctx.beginPath(); ctx.arc(sx,sy,16,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(255,255,100,0.18)';
    ctx.beginPath(); ctx.arc(sx,sy,8,0,TAU); ctx.fill();
    ctx.fillStyle='#ffffff';
    ctx.beginPath(); ctx.arc(sx,sy,3.5,0,TAU); ctx.fill();
    ctx.restore();
  }
}

// ─── Player ───────────────────────────────────────────────────────────────────
class Player{
  constructor(){
    this.wx=WORLD_W/2; this.wy=WORLD_H/2;
    this.vx=0; this.vy=0;
    this.moveAngle=0;   // facing direction (from movement)
    this.aimAngle=0;    // shooting direction (from right stick / mouse)
    this.alive=true;
    this.invincible=0;
    this.shootCD=0;
    this.radius=11;
    this.thrustT=0;
    this.moving=false;
  }

  update(dt,bullets){
    // ── Left stick (WASD): move + rotate ship ──
    let mx=0, my=0;
    if(keys['KeyW']) my-=1;
    if(keys['KeyS']) my+=1;
    if(keys['KeyA']) mx-=1;
    if(keys['KeyD']) mx+=1;

    this.moving=(mx!==0||my!==0);
    if(this.moving){
      const len=hypot(mx,my);
      const spd=432;
      this.vx+=(mx/len*spd-this.vx)*dt*8;
      this.vy+=(my/len*spd-this.vy)*dt*8;
      this.moveAngle=Math.atan2(my/len,mx/len);
      this.thrustT+=dt;
    } else {
      this.vx*=1-dt*9;
      this.vy*=1-dt*9;
    }

    this.wx=clamp(this.wx+this.vx*dt, this.radius, WORLD_W-this.radius);
    this.wy=clamp(this.wy+this.vy*dt, this.radius, WORLD_H-this.radius);

    // ── Right stick: aim (arrow keys) or mouse ──
    let ax=0, ay=0;
    if(keys['ArrowUp'])    ay-=1;
    if(keys['ArrowDown'])  ay+=1;
    if(keys['ArrowLeft'])  ax-=1;
    if(keys['ArrowRight']) ax+=1;

    const usingArrows=(ax!==0||ay!==0);
    if(usingArrows){
      const len=hypot(ax,ay);
      this.aimAngle=Math.atan2(ay/len,ax/len);
    } else {
      // Mouse aim: convert screen→world
      const wmx=mouse.x+camX, wmy=mouse.y+camY;
      const dx=wmx-this.wx, dy=wmy-this.wy;
      if(hypot(dx,dy)>20) this.aimAngle=Math.atan2(dy,dx);
    }

    // ── Shoot ──
    this.shootCD-=dt;
    const shooting=(usingArrows||(mouse.down));
    if(shooting && this.shootCD<=0){
      this.shootCD=0.09;
      sfxShoot();
      const sp=(Math.random()-0.5)*0.045;
      const spd=740;
      bullets.push(new Bullet(
        this.wx+Math.cos(this.aimAngle)*16,
        this.wy+Math.sin(this.aimAngle)*16,
        Math.cos(this.aimAngle+sp)*spd,
        Math.sin(this.aimAngle+sp)*spd
      ));
    }

    if(this.invincible>0) this.invincible-=dt;
  }

  draw(){
    if(!this.alive) return;
    if(this.invincible>0 && (this.invincible*9|0)%2===0) return;

    const sx=this.wx-camX, sy=this.wy-camY;
    ctx.save();
    ctx.translate(sx,sy);
    ctx.rotate(this.moveAngle);
    ctx.globalCompositeOperation='lighter';
    ctx.lineCap='round';

    // Thruster flame (multi-stroke glow, no shadowBlur)
    if(this.moving){
      const fl=10+Math.sin(this.thrustT*25)*5;
      const flame=()=>{ ctx.beginPath(); ctx.moveTo(-13,-4); ctx.lineTo(-13-fl,0); ctx.lineTo(-13,4); };
      ctx.strokeStyle='rgba(255,80,0,0.08)';  ctx.lineWidth=14; flame(); ctx.stroke();
      ctx.strokeStyle='rgba(255,130,40,0.40)'; ctx.lineWidth=6;  flame(); ctx.stroke();
      ctx.strokeStyle='rgba(255,220,80,0.85)'; ctx.lineWidth=2;  flame(); ctx.stroke();
    }

    // Ship shape (multi-stroke glow, no shadowBlur)
    const ship=()=>{
      ctx.beginPath();
      ctx.moveTo(20,0); ctx.lineTo(-10,9); ctx.lineTo(-5,0); ctx.lineTo(-10,-9);
      ctx.closePath();
    };
    ctx.strokeStyle='rgba(100,160,255,0.06)'; ctx.lineWidth=24; ship(); ctx.stroke();
    ctx.strokeStyle='rgba(140,190,255,0.22)'; ctx.lineWidth=9;  ship(); ctx.stroke();
    ctx.strokeStyle='rgba(180,210,255,0.55)'; ctx.lineWidth=3;  ship(); ctx.stroke();
    ctx.strokeStyle='#ffffff';                ctx.lineWidth=1.2; ship(); ctx.stroke();

    // Aim direction indicator (small dot, no shadowBlur)
    ctx.restore();
    ctx.save();
    ctx.translate(sx,sy);
    ctx.rotate(this.aimAngle);
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(255,255,60,0.15)';
    ctx.beginPath(); ctx.arc(28,0,7,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(255,255,100,0.65)';
    ctx.beginPath(); ctx.arc(28,0,3,0,TAU); ctx.fill();
    ctx.restore();
  }

  die(game){
    if(this.invincible>0) return false;
    this.alive=false;
    sfxPlayerDie();
    spawnBurst(this.wx,this.wy,'#88aaff', 80,100,600,2,6);
    spawnBurst(this.wx,this.wy,'#ffffff', 35, 50,300,1,3.5);
    spawnShards(this.wx,this.wy,'#aabbff',20,500,1100);
    spawnShards(this.wx,this.wy,'#ffffff',10,400, 800);
    spawnRing  (this.wx,this.wy,'#88aaff',52,250,580);
    game.grid.push(this.wx,this.wy,25,350);
    return true;
  }
}

// ─── Enemy base ───────────────────────────────────────────────────────────────
class Enemy{
  constructor(wx,wy){ this.wx=wx; this.wy=wy; this.vx=0; this.vy=0; this.alive=true; this.radius=10; this.color='#ffffff'; this.pts=10; this.angle=0; }
  get screenX(){ return this.wx-camX; }
  get screenY(){ return this.wy-camY; }
  inView(pad=60){ const sx=this.screenX,sy=this.screenY; return sx>-pad&&sx<W+pad&&sy>-pad&&sy<H+pad; }

  die(game){
    sfxExplode();
    // Dense core flash — bright cluster at impact
    spawnBurst(this.wx,this.wy, this.color, 110, 55, 580, 2,   6.5);
    spawnBurst(this.wx,this.wy,'#ffffff',    50, 30, 300, 1,   3.5);
    // Fast streamer shards — shoot far across the screen
    spawnShards(this.wx,this.wy, this.color, 26, 420, 920);
    spawnShards(this.wx,this.wy,'#ffffff',   14, 350, 750);
    // Shockwave rings
    spawnRing(this.wx,this.wy, this.color,   52, 220, 520);
    spawnRing(this.wx,this.wy,'#ffffff',     26, 110, 300);
    // Slow outer ghost ring (double-ripple effect)
    spawnRing(this.wx,this.wy, this.color,   28,  70, 160);
    // Grid ripple
    game.grid.push(this.wx,this.wy, 20, 200);
    game.addKill(this.pts);
    this.alive=false;
  }
}

// ─── Geom ─────────────────────────────────────────────────────────────────────
class Geom extends Enemy{
  constructor(wx,wy){
    super(wx,wy);
    const spd=rand(60,110), a=rand(0,TAU);
    this.vx=Math.cos(a)*spd; this.vy=Math.sin(a)*spd;
    this.radius=11; this.color='#33ff22'; this.pts=10;
    this.spin=rand(-3.5,3.5);
  }
  update(dt,_p,grid){
    this.wx+=this.vx*dt; this.wy+=this.vy*dt; this.angle+=this.spin*dt;
    const r=this.radius;
    if(this.wx<r){     this.wx=r;         this.vx= Math.abs(this.vx); grid.push(this.wx,this.wy,5,80); }
    if(this.wx>WORLD_W-r){ this.wx=WORLD_W-r; this.vx=-Math.abs(this.vx); grid.push(this.wx,this.wy,5,80); }
    if(this.wy<r){     this.wy=r;         this.vy= Math.abs(this.vy); grid.push(this.wx,this.wy,5,80); }
    if(this.wy>WORLD_H-r){ this.wy=WORLD_H-r; this.vy=-Math.abs(this.vy); grid.push(this.wx,this.wy,5,80); }
    if(Math.random()<0.07) grid.push(this.wx,this.wy,2,55);
  }
  draw(){
    if(!this.inView()) return;
    const sx=this.screenX, sy=this.screenY;
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(this.angle);
    ctx.globalCompositeOperation='lighter'; ctx.lineCap='round';
    const sq=(s)=>{ ctx.beginPath(); ctx.rect(-s,-s,s*2,s*2); };
    ctx.strokeStyle='rgba(0,255,0,0.05)'; ctx.lineWidth=22; sq(13); ctx.stroke();
    ctx.strokeStyle='rgba(51,255,34,0.18)'; ctx.lineWidth=10; sq(13); ctx.stroke();
    ctx.strokeStyle='#aaffaa'; ctx.lineWidth=1.5; sq(11); ctx.stroke();
    ctx.restore();
  }
}

// ─── Seeker ───────────────────────────────────────────────────────────────────
class Seeker extends Enemy{
  constructor(wx,wy){
    super(wx,wy);
    this.speed=rand(90,155); this.heading=rand(0,TAU);
    this.turnRate=2.0+Math.random()*0.8;
    this.radius=12; this.color='#ff6600'; this.pts=25;
    this.spin=rand(2,5)*(Math.random()<0.5?1:-1);
  }
  update(dt,player,grid){
    const dx=player.wx-this.wx, dy=player.wy-this.wy;
    let diff=Math.atan2(dy,dx)-this.heading;
    while(diff>Math.PI)  diff-=TAU;
    while(diff<-Math.PI) diff+=TAU;
    this.heading+=diff*dt*this.turnRate;
    this.wx+=Math.cos(this.heading)*this.speed*dt;
    this.wy+=Math.sin(this.heading)*this.speed*dt;
    this.angle+=this.spin*dt;
    const r=this.radius;
    if(this.wx<r||this.wx>WORLD_W-r){ this.vx*=-1; this.heading=Math.atan2(this.vy,this.vx); }
    if(this.wy<r||this.wy>WORLD_H-r){ this.vy*=-1; this.heading=Math.atan2(this.vy,this.vx); }
    this.wx=clamp(this.wx,r,WORLD_W-r); this.wy=clamp(this.wy,r,WORLD_H-r);
    if(Math.random()<0.10) grid.push(this.wx,this.wy,2.5,55);

    if(Math.random()<0.6) spawnTrail(this.wx,this.wy,'#ff4400',rand(1.5,3));
    if(Math.random()<0.2) spawnTrail(this.wx,this.wy,'#ffaa00',rand(0.8,2));
  }
  draw(){
    if(!this.inView()) return;
    const sx=this.screenX, sy=this.screenY;
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(this.angle);
    ctx.globalCompositeOperation='lighter';
    const dia=(s)=>{ ctx.beginPath(); ctx.moveTo(0,-s); ctx.lineTo(s,0); ctx.lineTo(0,s); ctx.lineTo(-s,0); ctx.closePath(); };
    ctx.strokeStyle='rgba(255,80,0,0.05)'; ctx.lineWidth=24; dia(15); ctx.stroke();
    ctx.strokeStyle='rgba(255,100,0,0.20)'; ctx.lineWidth=10; dia(15); ctx.stroke();
    ctx.strokeStyle='#ffaa55'; ctx.lineWidth=1.8; dia(12); ctx.stroke();
    ctx.restore();
  }
}

// ─── Pinwheel ─────────────────────────────────────────────────────────────────
class Pinwheel extends Enemy{
  constructor(wx,wy){
    super(wx,wy);
    this.vx=rand(-80,80); this.vy=rand(-80,80);
    this.wander=rand(0,TAU);
    this.radius=15; this.color='#00eeff'; this.pts=50;
    this.shotTimer=rand(2.5,4.5);
    this.charging=0; // visual charge-up before firing
  }
  update(dt,player,grid,game){
    this.wander+=rand(-0.9,0.9);
    // Strong random wander so it never idles
    let ax=Math.cos(this.wander)*90, ay=Math.sin(this.wander)*90;
    const dx=this.wx-player.wx, dy=this.wy-player.wy;
    const d=hypot(dx,dy)+0.01;
    // Repel when inside 260px, weakly attract from beyond 420px
    if(d<260){ const f=200*(1-d/260); ax+=dx/d*f; ay+=dy/d*f; }
    else if(d>420){ const f=70*((d-420)/400); ax-=dx/d*Math.min(f,100); ay-=dy/d*Math.min(f,100); }
    this.vx+=ax*dt; this.vy+=ay*dt;
    const sp=hypot(this.vx,this.vy);
    // Hard min speed — never stops
    if(sp<60 && sp>0.001){ this.vx=this.vx/sp*60; this.vy=this.vy/sp*60; }
    else if(sp<0.001){ this.vx=Math.cos(this.wander)*60; this.vy=Math.sin(this.wander)*60; }
    if(sp>260){ this.vx=this.vx/sp*260; this.vy=this.vy/sp*260; }
    this.wx+=this.vx*dt; this.wy+=this.vy*dt;
    this.angle+=5*dt;
    const r=this.radius;
    if(this.wx<r||this.wx>WORLD_W-r) this.vx*=-1;
    if(this.wy<r||this.wy>WORLD_H-r) this.vy*=-1;
    this.wx=clamp(this.wx,r,WORLD_W-r); this.wy=clamp(this.wy,r,WORLD_H-r);
    if(Math.random()<0.09) grid.push(this.wx,this.wy,2.2,55);
    // Charge-up glow
    if(this.charging>0) this.charging-=dt;
    // Shoot 4-way cross toward player every 3–4.5s
    this.shotTimer-=dt;
    if(this.shotTimer<=0 && game){
      this.shotTimer=rand(3.0,4.5);
      this.charging=0.18;
      sfxEnemyShoot();
      const toward=Math.atan2(player.wy-this.wy, player.wx-this.wx);
      const spd=230;
      for(let i=0;i<4;i++){
        const a=toward+i*Math.PI/2;
        game.enemyBullets.push(new EnemyBullet(this.wx,this.wy,Math.cos(a)*spd,Math.sin(a)*spd,'#00ddff'));
      }
      grid.push(this.wx,this.wy,4,70);
      spawnBurst(this.wx,this.wy,'#00eeff',10,30,90,1,3.5);
    }
  }
  draw(){
    if(!this.inView()) return;
    const sx=this.screenX, sy=this.screenY;
    ctx.save(); ctx.translate(sx,sy);
    ctx.globalCompositeOperation='lighter';
    // Charge-up flash before firing
    if(this.charging>0){
      ctx.globalAlpha=this.charging*5;
      ctx.fillStyle='#ffffff';
      ctx.beginPath(); ctx.arc(0,0,18,0,TAU); ctx.fill();
      ctx.globalAlpha=1;
    }
    for(let arm=0;arm<4;arm++){
      ctx.save(); ctx.rotate(this.angle+arm*Math.PI/2);
      const blade=()=>{ ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(12,-7,16,2); ctx.quadraticCurveTo(9,10,0,0); };
      ctx.fillStyle='rgba(0,238,255,0.12)'; blade(); ctx.fill();
      ctx.strokeStyle='rgba(0,220,255,0.10)'; ctx.lineWidth=10; blade(); ctx.stroke();
      ctx.strokeStyle='rgba(0,238,255,0.55)'; ctx.lineWidth=3;  blade(); ctx.stroke();
      ctx.strokeStyle='rgba(120,255,255,0.88)'; ctx.lineWidth=1; blade(); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }
}

class SnakeBody extends Enemy{
  constructor(head,delayFrames){
    super(head.wx,head.wy);
    this.head=head; this.delay=delayFrames;
    this.radius=8; this.color='#ff00ee'; this.pts=5;
  }
  update(dt,_p,grid){
    if(!this.head.alive) return;
    const idx=Math.min(this.head.history.length-1,this.delay);
    const pos=this.head.history[idx];
    if(pos){ this.wx=pos.wx; this.wy=pos.wy; }
    if(Math.random()<0.05) grid.push(this.wx,this.wy,1.2,35);
  }
  draw(){
    if(!this.inView()) return;
    const sx=this.screenX, sy=this.screenY;
    ctx.save(); ctx.translate(sx,sy);
    ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle='rgba(180,0,200,0.07)'; ctx.lineWidth=14;
    ctx.beginPath(); ctx.arc(0,0,this.radius+4,0,TAU); ctx.stroke();
    ctx.strokeStyle='rgba(255,0,238,0.22)'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.arc(0,0,this.radius+2,0,TAU); ctx.stroke();
    ctx.strokeStyle='#ff88ff'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(0,0,this.radius,0,TAU); ctx.stroke();
    ctx.restore();
  }
}

// ─── EnemyBullet ──────────────────────────────────────────────────────────────
class EnemyBullet{
  constructor(wx,wy,vx,vy,color='#ff4400'){
    this.wx=wx; this.wy=wy; this.vx=vx; this.vy=vy;
    this.alive=true; this.ttl=3.5;
    this.color=color; this.radius=4;
  }
  update(dt){
    this.wx+=this.vx*dt; this.wy+=this.vy*dt;
    this.ttl-=dt;
    if(this.wx<0||this.wx>WORLD_W||this.wy<0||this.wy>WORLD_H||this.ttl<=0)
      this.alive=false;
    if(Math.random()<0.65) spawnTrail(this.wx,this.wy,this.color,rand(1.2,2.2));
    if(Math.random()<0.3)  spawnTrail(this.wx,this.wy,'#ffffff',rand(0.5,1.1));
  }
  draw(){
    const sx=this.wx-camX, sy=this.wy-camY;
    if(sx<-20||sx>W+20||sy<-20||sy>H+20) return;
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    // Soft glow ring (no shadowBlur)
    ctx.globalAlpha=0.10; ctx.fillStyle=this.color;
    ctx.beginPath(); ctx.arc(sx,sy,12,0,TAU); ctx.fill();
    ctx.globalAlpha=0.30; ctx.fillStyle=this.color;
    ctx.beginPath(); ctx.arc(sx,sy,6,0,TAU); ctx.fill();
    ctx.globalAlpha=1;  ctx.fillStyle='#ffeecc';
    ctx.beginPath(); ctx.arc(sx,sy,3.5,0,TAU); ctx.fill();
    ctx.restore();
  }
}

// ─── Shooter ──────────────────────────────────────────────────────────────────
class Shooter extends Enemy{
  constructor(wx,wy){
    super(wx,wy);
    this.speed=rand(70,110); this.heading=rand(0,TAU);
    this.turnRate=2.2;
    this.radius=13; this.color='#ff3300'; this.pts=60;
    this.shotTimer=rand(1.8,3.2);
    this.orbitDir=(Math.random()<0.5)?1:-1;
    this.preferredDist=rand(260,380);
    this.spin=rand(1.5,3)*(Math.random()<0.5?1:-1);
  }
  update(dt,player,grid,game){
    const dx=player.wx-this.wx, dy=player.wy-this.wy;
    const d=hypot(dx,dy)+0.01;
    const toAngle=Math.atan2(dy,dx);
    // Orbit perpendicular + approach/retreat
    const sideAngle=toAngle+Math.PI/2*this.orbitDir;
    let targetAngle=sideAngle;
    if(d>this.preferredDist+80) targetAngle=toAngle;            // rush in
    else if(d<this.preferredDist-80) targetAngle=toAngle+Math.PI; // back off
    let diff=targetAngle-this.heading;
    while(diff>Math.PI)  diff-=TAU;
    while(diff<-Math.PI) diff+=TAU;
    this.heading+=diff*dt*this.turnRate;
    this.wx+=Math.cos(this.heading)*this.speed*dt;
    this.wy+=Math.sin(this.heading)*this.speed*dt;
    const r=this.radius;
    this.wx=clamp(this.wx,r,WORLD_W-r); this.wy=clamp(this.wy,r,WORLD_H-r);
    this.angle+=this.spin*dt;
    if(Math.random()<0.12) grid.push(this.wx,this.wy,3,65);
    if(Math.random()<0.5) spawnTrail(this.wx,this.wy,'#ff3300',rand(1.2,2.5));
    // Fire aimed 3-way spread at player
    this.shotTimer-=dt;
    if(this.shotTimer<=0 && game && d>1){
      this.shotTimer=rand(1.8,3.0);
      sfxEnemyShoot();
      const a=Math.atan2(player.wy-this.wy, player.wx-this.wx);
      const spd=270;
      game.enemyBullets.push(new EnemyBullet(this.wx,this.wy, Math.cos(a)*spd,     Math.sin(a)*spd,     '#ff4400'));
      game.enemyBullets.push(new EnemyBullet(this.wx,this.wy, Math.cos(a+0.22)*spd*0.85,Math.sin(a+0.22)*spd*0.85,'#ff2200'));
      game.enemyBullets.push(new EnemyBullet(this.wx,this.wy, Math.cos(a-0.22)*spd*0.85,Math.sin(a-0.22)*spd*0.85,'#ff2200'));
      spawnBurst(this.wx,this.wy,'#ff3300',12,25,100,1,3.5);
      grid.push(this.wx,this.wy,5,80);
    }
  }
  draw(){
    if(!this.inView()) return;
    const sx=this.screenX, sy=this.screenY;
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(this.angle);
    ctx.globalCompositeOperation='lighter';
    // Hexagon body
    const hex=()=>{ ctx.beginPath(); for(let i=0;i<6;i++){ const a=i*Math.PI/3; i===0?ctx.moveTo(Math.cos(a)*13,Math.sin(a)*13):ctx.lineTo(Math.cos(a)*13,Math.sin(a)*13); } ctx.closePath(); };
    ctx.strokeStyle='rgba(255,40,0,0.06)'; ctx.lineWidth=22; hex(); ctx.stroke();
    ctx.strokeStyle='rgba(255,80,0,0.22)'; ctx.lineWidth=9;  hex(); ctx.stroke();
    ctx.strokeStyle='#ff9966';             ctx.lineWidth=2;  hex(); ctx.stroke();
    // Bright core (no shadowBlur)
    ctx.fillStyle='rgba(255,80,0,0.15)'; ctx.beginPath(); ctx.arc(0,0,10,0,TAU); ctx.fill();
    ctx.fillStyle='#ff7744';             ctx.beginPath(); ctx.arc(0,0,4.5,0,TAU); ctx.fill();
    ctx.restore();
  }
}

// ─── BlackHole ────────────────────────────────────────────────────────────────
class BlackHole extends Enemy{
  constructor(wx,wy){
    super(wx,wy);
    this.hp=6; this.maxHp=6;
    this.vx=rand(-35,35); this.vy=rand(-35,35);
    this.radius=20; this.color='#9900ff'; this.pts=500;
    this.pullRadius=250;
    this.arcAngle=0;
  }
  update(dt,player,grid){
    this.wx+=this.vx*dt; this.wy+=this.vy*dt;
    const r=this.radius;
    if(this.wx<r){          this.wx=r;          this.vx= Math.abs(this.vx); }
    if(this.wx>WORLD_W-r){  this.wx=WORLD_W-r;  this.vx=-Math.abs(this.vx); }
    if(this.wy<r){          this.wy=r;          this.vy= Math.abs(this.vy); }
    if(this.wy>WORLD_H-r){  this.wy=WORLD_H-r;  this.vy=-Math.abs(this.vy); }
    this.arcAngle+=dt*2.4;
    // Pull grid inward (negative force = attract)
    grid.push(this.wx,this.wy,-7, this.pullRadius*0.55);
    // Spiraling inward particle wisps
    if(Math.random()<0.55){
      const a=rand(0,TAU), d=rand(55,this.pullRadius*0.85);
      spawnTrail(this.wx+Math.cos(a)*d, this.wy+Math.sin(a)*d, '#6600cc', rand(1.2,2.5));
    }
    if(Math.random()<0.25) spawnTrail(this.wx,this.wy,'#cc44ff',rand(1,2.2));
  }
  // Returns true if dead (called from collision handler)
  hit(game){
    this.hp--;
    sfxBlackHoleHit();
    spawnBurst(this.wx,this.wy,'#cc44ff',14,20,130,0.7,2.8);
    game.grid.push(this.wx,this.wy,-14,90);
    if(this.hp<=0){ this.die(game); return true; }
    return false;
  }
  die(game){
    sfxExplode(true);
    spawnBurst(this.wx,this.wy,'#9900ff', 150, 80,600,1.5,7);
    spawnBurst(this.wx,this.wy,'#ffffff',   70, 55,320,1,  5);
    spawnBurst(this.wx,this.wy,'#ff88ff',   60, 65,420,1.3,6);
    spawnShards(this.wx,this.wy,'#9900ff',  35,500,1100);
    spawnShards(this.wx,this.wy,'#ff44ff',  20,400, 900);
    spawnShards(this.wx,this.wy,'#ffffff',  15,350, 800);
    spawnRing (this.wx,this.wy,'#9900ff',   60,230,600);
    spawnRing (this.wx,this.wy,'#ffffff',   30,120,320);
    spawnRing (this.wx,this.wy,'#ff44ff',   30, 80,200);
    game.grid.push(this.wx,this.wy,35,340);
    game.addKill(this.pts);
    this.alive=false;
  }
  draw(){
    if(!this.inView()) return;
    const sx=this.screenX, sy=this.screenY;
    ctx.save(); ctx.translate(sx,sy);
    ctx.globalCompositeOperation='lighter';
    // Outer pull aura glow
    const aura=ctx.createRadialGradient(0,0,this.radius,0,0,this.pullRadius*0.48);
    aura.addColorStop(0,'rgba(80,0,200,0.20)');
    aura.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=aura; ctx.beginPath(); ctx.arc(0,0,this.pullRadius*0.48,0,TAU); ctx.fill();
    // Rotating arc segments (multi-stroke glow, no shadowBlur)
    ctx.lineCap='round';
    // Outer glow pass for arcs
    ctx.lineWidth=14;
    for(let i=0;i<4;i++){
      const a=this.arcAngle + i*(TAU/4);
      ctx.strokeStyle='rgba(120,0,220,0.12)';
      ctx.beginPath(); ctx.arc(0,0,this.radius+6, a, a+Math.PI*0.55); ctx.stroke();
    }
    ctx.lineWidth=5;
    for(let i=0;i<4;i++){
      const a=this.arcAngle + i*(TAU/4);
      ctx.strokeStyle='rgba(180,60,255,0.55)';
      ctx.beginPath(); ctx.arc(0,0,this.radius+6, a, a+Math.PI*0.55); ctx.stroke();
    }
    ctx.lineWidth=2.5;
    for(let i=0;i<4;i++){
      const a=this.arcAngle + i*(TAU/4);
      ctx.strokeStyle='rgba(220,130,255,0.92)';
      ctx.beginPath(); ctx.arc(0,0,this.radius+6, a, a+Math.PI*0.55); ctx.stroke();
    }
    // Second ring spinning opposite
    ctx.lineWidth=5;
    for(let i=0;i<3;i++){
      const a=-this.arcAngle*0.7 + i*(TAU/3);
      ctx.strokeStyle='rgba(200,60,240,0.25)';
      ctx.beginPath(); ctx.arc(0,0,this.radius+12, a, a+Math.PI*0.38); ctx.stroke();
    }
    ctx.lineWidth=1.8;
    for(let i=0;i<3;i++){
      const a=-this.arcAngle*0.7 + i*(TAU/3);
      ctx.strokeStyle='rgba(255,100,255,0.60)';
      ctx.beginPath(); ctx.arc(0,0,this.radius+12, a, a+Math.PI*0.38); ctx.stroke();
    }
    // Inner void (punches dark hole)
    ctx.globalCompositeOperation='source-over';
    ctx.beginPath(); ctx.arc(0,0,this.radius,0,TAU);
    const innerG=ctx.createRadialGradient(0,0,0,0,0,this.radius);
    innerG.addColorStop(0,'rgba(0,0,0,1)');
    innerG.addColorStop(0.65,'rgba(10,0,25,0.92)');
    innerG.addColorStop(1,'rgba(40,0,80,0.45)');
    ctx.fillStyle=innerG; ctx.fill();
    // HP arc indicator (no shadowBlur)
    ctx.globalCompositeOperation='lighter';
    const hpFrac=this.hp/this.maxHp;
    ctx.lineCap='round';
    ctx.lineWidth=7; ctx.strokeStyle='rgba(180,80,255,0.20)';
    ctx.beginPath(); ctx.arc(0,0,this.radius+13,-Math.PI/2,-Math.PI/2+TAU*hpFrac); ctx.stroke();
    ctx.lineWidth=2.5; ctx.strokeStyle='rgba(200,100,255,0.90)';
    ctx.beginPath(); ctx.arc(0,0,this.radius+13,-Math.PI/2,-Math.PI/2+TAU*hpFrac); ctx.stroke();
    ctx.restore();
  }
}

// ─── Game ─────────────────────────────────────────────────────────────────────
class Game{
  constructor(){
    this.grid    = new Grid();
    this.player  = new Player();
    this.bullets      = [];
    this.enemies      = [];
    this.enemyBullets = [];
    this.score   = 0;
    this.hi      = savedHi;
    this.mult    = 1;
    this.lives   = 3;
    this.state   = 'playing';
    this.deadT   = 0;
    this.waveT   = 0;
    this.wave    = 0;
    this.flashT  = 0;
    this.borderG = 0;
    // Event system
    this.gameTime        = 0;
    this.eventTimer      = 22;   // seconds until first event
    this.eventName       = null;
    this.eventDisplayTimer = 0;
    // Init camera
    camX = clamp(this.player.wx - W/2, 0, WORLD_W - W);
    camY = clamp(this.player.wy - H/2, 0, WORLD_H - H);
  }

  addKill(pts){
    this.score+=pts*this.mult;
    this.mult=Math.min(this.mult+1,20);
    this.borderG=0.4; this.flashT=0.04;
  }

  // Spawn at world boundary
  worldEdge(){
    const side=rInt(0,4);
    if(side===0) return [rand(0,WORLD_W), rand(0,30)];
    if(side===1) return [rand(0,WORLD_W), rand(WORLD_H-30,WORLD_H)];
    if(side===2) return [rand(0,30),      rand(0,WORLD_H)];
    return            [rand(WORLD_W-30,WORLD_W), rand(0,WORLD_H)];
  }

  worldEdgeOnSide(side){
    if(side===0) return [rand(0,WORLD_W), rand(0,30)];
    if(side===1) return [rand(0,WORLD_W), rand(WORLD_H-30,WORLD_H)];
    if(side===2) return [rand(0,30),      rand(0,WORLD_H)];
    return            [rand(WORLD_W-30,WORLD_W), rand(0,WORLD_H)];
  }

  triggerEvent(){
    sfxEvent();
    const EVENTS=['SWARM','BLACK HOLE','SERPENTS','ONSLAUGHT','KAMIKAZE'];
    // KAMIKAZE unlocks after 60s
    const pool = (this.gameTime<60) ? EVENTS.slice(0,4) : EVENTS;
    const evt  = pool[rInt(0,pool.length)];
    this.eventName        = evt;
    this.eventDisplayTimer = 3.8;
    // Interval shrinks from 22s → 11s over ~3 min
    this.eventTimer = Math.max(11, 22 - this.gameTime * 0.037);

    const side=rInt(0,4);

    if(evt==='SWARM'){
      // Dense mass from one side
      const n=18+rInt(0,12);
      for(let i=0;i<n;i++){
        const [wx,wy]=this.worldEdgeOnSide(side);
        this.enemies.push(new Geom(wx+rand(-70,70), wy+rand(-70,70)));
      }
    } else if(evt==='BLACK HOLE'){
      const n=(this.gameTime>120) ? 2 : 1;
      for(let i=0;i<n;i++){
        const [wx,wy]=this.worldEdgeOnSide((side+i*2)%4);
        this.enemies.push(new BlackHole(wx,wy));
      }
    } else if(evt==='SERPENTS'){
      const n=3+rInt(0,3);
      for(let i=0;i<n;i++){
        const [wx,wy]=this.worldEdgeOnSide((side+i)%4);
        const head=new SnakeHead(wx,wy);
        this.enemies.push(head);
        const len=5+rInt(0,7);
        for(let j=0;j<len;j++)
          this.enemies.push(new SnakeBody(head,(j+1)*14));
      }
    } else if(evt==='ONSLAUGHT'){
      // All types at once
      for(let i=0;i<8;i++)  this.enemies.push(new Geom(...this.worldEdge()));
      for(let i=0;i<3;i++)  this.enemies.push(new Seeker(...this.worldEdge()));
      for(let i=0;i<2;i++)  this.enemies.push(new Pinwheel(...this.worldEdge()));
      for(let i=0;i<2;i++)  this.enemies.push(new Shooter(...this.worldEdge()));
      const head=new SnakeHead(...this.worldEdge());
      this.enemies.push(head);
      for(let j=0;j<5;j++) this.enemies.push(new SnakeBody(head,(j+1)*14));
    } else if(evt==='KAMIKAZE'){
      const n=8+rInt(0,6);
      for(let i=0;i<n;i++){
        const [wx,wy]=this.worldEdgeOnSide((side+rInt(0,4))%4);
        this.enemies.push(new KamikazeSeeker(wx,wy));
      }
    }
  }

  spawnWave(){
    this.wave++;
    if(this.enemies.length>60) return; // cap
    const type=rInt(0,5);
    const [wx,wy]=this.worldEdge();

    if(type===0){
      const n=4+rInt(0,Math.min(this.wave,5));
      for(let i=0;i<n;i++)
        this.enemies.push(new Geom(wx+rand(-40,40),wy+rand(-40,40)));
    } else if(type===1){
      const n=2+rInt(0,Math.min(this.wave,3));
      for(let i=0;i<n;i++){
        const [ex,ey]=this.worldEdge();
        this.enemies.push(new Seeker(ex,ey));
      }
    } else if(type===2){
      const n=2+rInt(0,Math.min(this.wave,3));
      for(let i=0;i<n;i++){
        const [ex,ey]=this.worldEdge();
        this.enemies.push(new Pinwheel(ex,ey));
      }
    } else if(type===3){
      const head=new SnakeHead(wx,wy);
      this.enemies.push(head);
      const len=3+rInt(0,Math.min(this.wave,7));
      for(let i=0;i<len;i++)
        this.enemies.push(new SnakeBody(head,(i+1)*14));
    } else {
      // Shooter — unlocks after wave 3
      const n=(this.wave>=3) ? 1+rInt(0,2) : 1;
      for(let i=0;i<n;i++){
        const [ex,ey]=this.worldEdge();
        this.enemies.push(new Shooter(ex,ey));
      }
    }
  }

  updateCamera(dt){
    const p=this.player;
    // Gentle lead in movement direction so player stays on screen
    const lead=p.moving?55:0;
    const tx=p.wx+Math.cos(p.moveAngle)*lead - W/2;
    const ty=p.wy+Math.sin(p.moveAngle)*lead - H/2;
    camX+=(tx-camX)*Math.min(1,dt*6);
    camY+=(ty-camY)*Math.min(1,dt*6);
    camX=clamp(camX,0,Math.max(0,WORLD_W-W));
    camY=clamp(camY,0,Math.max(0,WORLD_H-H));
  }

  update(dt){
    if(this.state==='gameover') return;

    // Event system
    if(this.state==='playing'){
      this.gameTime+=dt;
      this.eventTimer-=dt;
      if(this.eventTimer<=0) this.triggerEvent();
    }
    // Event announcement timer runs even when dead so it finishes fading
    if(this.eventDisplayTimer>0) this.eventDisplayTimer-=dt;

    this.waveT-=dt;
    if(this.waveT<=0){
      this.waveT=Math.max(1.0, 3.5-this.wave*0.06);
      this.spawnWave();
    }

    this.grid.update(dt);

    if(this.state==='playing'){
      this.player.update(dt,this.bullets);
      this.updateCamera(dt);
    } else if(this.state==='dead'){
      this.deadT-=dt;
      if(this.deadT<=0){
        if(this.lives>0){
          this.state='playing';
          this.player=new Player();
          this.player.invincible=3.5;
          this.mult=1;
          camX=clamp(this.player.wx-W/2,0,WORLD_W-W);
          camY=clamp(this.player.wy-H/2,0,WORLD_H-H);
        } else {
          this.state='gameover';
          savedHi=Math.max(savedHi,this.score);
          this.hi=savedHi;
        }
      }
    }

    // Black hole gravity: bends bullet trajectories
    for(const e of this.enemies){
      if(!e.alive || !(e instanceof BlackHole)) continue;
      for(const b of this.bullets){
        if(!b.alive) continue;
        const dx=e.wx-b.wx, dy=e.wy-b.wy;
        const dist2=dx*dx+dy*dy;
        const pr=e.pullRadius;
        if(dist2 < pr*pr && dist2>1){
          const dist=Math.sqrt(dist2);
          const force=5500/(dist2);
          b.vx+=dx/dist*force*dt;
          b.vy+=dy/dist*force*dt;
        }
      }
    }

    for(let i=this.bullets.length-1;i>=0;i--){
      this.bullets[i].update(dt);
      if(!this.bullets[i].alive) this.bullets.splice(i,1);
    }
    for(let i=this.enemyBullets.length-1;i>=0;i--){
      this.enemyBullets[i].update(dt);
      if(!this.enemyBullets[i].alive) this.enemyBullets.splice(i,1);
    }
    for(const e of this.enemies) if(e.alive) e.update(dt,this.player,this.grid,this);

    // Bullet vs enemy
    for(let bi=this.bullets.length-1;bi>=0;bi--){
      const b=this.bullets[bi]; if(!b.alive) continue;
      for(const e of this.enemies){
        if(!e.alive) continue;
        if(hypot(b.wx-e.wx,b.wy-e.wy)<e.radius+5){
          b.alive=false;
          if(e instanceof BlackHole) e.hit(this);
          else e.die(this);
          break;
        }
      }
    }

    // Enemy bullets vs player
    if(this.state==='playing'&&this.player.alive){
      const p=this.player;
      for(let i=this.enemyBullets.length-1;i>=0;i--){
        const eb=this.enemyBullets[i];
        if(!eb.alive) continue;
        if(hypot(eb.wx-p.wx,eb.wy-p.wy)<eb.radius+p.radius-2){
          eb.alive=false;
          spawnBurst(eb.wx,eb.wy,eb.color,18,40,120,1,3.5);
          if(p.die(this)){
            this.lives--; this.state='dead'; this.deadT=2.2; this.mult=1;
          }
          break;
        }
      }
    }

    // Player vs enemy
    if(this.state==='playing'&&this.player.alive){
      const p=this.player;
      for(const e of this.enemies){
        if(!e.alive) continue;
        if(hypot(p.wx-e.wx,p.wy-e.wy)<e.radius+p.radius-5){
          if(p.die(this)){
            this.lives--; this.state='dead'; this.deadT=2.2; this.mult=1; break;
          }
        }
      }
    }

    for(let i=this.enemies.length-1;i>=0;i--)
      if(!this.enemies[i].alive) this.enemies.splice(i,1);

    updateParticles(dt);
    if(this.borderG>0) this.borderG-=dt*1.5;
    if(this.flashT>0)  this.flashT-=dt;
  }

  // World boundary glow (multi-stroke, no shadowBlur)
  drawWorldBorder(){
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    const bx=-camX, by=-camY;
    // Wide soft outer glow
    ctx.strokeStyle='rgba(25,5,150,0.18)'; ctx.lineWidth=70; ctx.strokeRect(bx,by,WORLD_W,WORLD_H);
    ctx.strokeStyle='rgba(40,10,190,0.30)'; ctx.lineWidth=36; ctx.strokeRect(bx,by,WORLD_W,WORLD_H);
    ctx.strokeStyle='rgba(60,20,230,0.50)'; ctx.lineWidth=14; ctx.strokeRect(bx,by,WORLD_W,WORLD_H);
    ctx.strokeStyle='rgba(80,30,255,0.80)'; ctx.lineWidth=3;  ctx.strokeRect(bx,by,WORLD_W,WORLD_H);
    ctx.restore();
  }

  drawKillFlash(){
    if(this.flashT>0){
      ctx.fillStyle=`rgba(255,255,200,${this.flashT*5})`;
      ctx.fillRect(0,0,W,H);
    }
  }

  drawBorderVignette(){
    const i=0.22+this.borderG*0.45;
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    // Top edge
    let g=ctx.createLinearGradient(0,0,0,55);
    g.addColorStop(0,`rgba(50,0,255,${i*0.6})`); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,55);
    // Bottom edge
    g=ctx.createLinearGradient(0,H,0,H-55);
    g.addColorStop(0,`rgba(50,0,255,${i*0.6})`); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,H-55,W,55);
    // Left edge
    g=ctx.createLinearGradient(0,0,55,0);
    g.addColorStop(0,`rgba(50,0,255,${i*0.6})`); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,55,H);
    // Right edge
    g=ctx.createLinearGradient(W,0,W-55,0);
    g.addColorStop(0,`rgba(50,0,255,${i*0.6})`); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(W-55,0,55,H);
    ctx.restore();
  }

  drawMinimap(){
    const mw=160, mh=mw*(WORLD_H/WORLD_W)|0;
    const mx=W-mw-16, my=70;
    const sx=mw/WORLD_W, sy=mh/WORLD_H;

    ctx.save();
    ctx.globalAlpha=0.75;
    ctx.fillStyle='rgba(0,0,20,0.85)';
    ctx.strokeStyle='rgba(60,60,200,0.6)';
    ctx.lineWidth=1;
    ctx.fillRect(mx,my,mw,mh);
    ctx.strokeRect(mx,my,mw,mh);

    // Viewport box
    ctx.strokeStyle='rgba(120,120,255,0.4)';
    ctx.strokeRect(
      mx+camX*sx, my+camY*sy,
      W*sx, H*sy
    );

    // Enemies
    ctx.globalAlpha=0.9;
    for(const e of this.enemies){
      if(!e.alive) continue;
      ctx.fillStyle=e.color;
      ctx.fillRect(mx+e.wx*sx-1, my+e.wy*sy-1, 2, 2);
    }

    // Player (2-layer circle, no shadowBlur)
    ctx.fillStyle='rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.arc(mx+this.player.wx*sx, my+this.player.wy*sy, 5, 0, TAU); ctx.fill();
    ctx.fillStyle='#ffffff';
    ctx.beginPath(); ctx.arc(mx+this.player.wx*sx, my+this.player.wy*sy, 2.5, 0, TAU); ctx.fill();

    ctx.globalAlpha=1;
    ctx.restore();
  }

  drawUI(){
    ctx.save(); ctx.shadowBlur=12;
    ctx.font='bold 22px "Courier New",monospace'; ctx.textAlign='left';
    ctx.fillStyle='#ddddff'; ctx.shadowColor='#6688ff';
    ctx.fillText(`SCORE  ${String(this.score).padStart(9,'0')}`,22,38);
    ctx.font='13px "Courier New",monospace'; ctx.fillStyle='#667799'; ctx.shadowColor='#334466'; ctx.shadowBlur=5;
    ctx.fillText(`HI  ${String(this.hi).padStart(9,'0')}`,22,58);

    if(this.mult>1){
      ctx.font=`bold ${22+Math.min(this.mult,18)}px "Courier New",monospace`;
      ctx.textAlign='center'; ctx.fillStyle='#ffff00';
      ctx.shadowColor='#ffdd00'; ctx.shadowBlur=22;
      ctx.fillText(`×${this.mult}`,W/2,44);
    }

    ctx.textAlign='right'; ctx.shadowColor='#8899ff'; ctx.shadowBlur=14;
    for(let i=0;i<this.lives;i++){
      ctx.font='20px "Courier New",monospace'; ctx.fillStyle='#88aaff';
      ctx.fillText('▲',W-18-i*30,38);
    }

    // Controls hint (top-center, fades after wave 3)
    if(this.wave<4){
      ctx.textAlign='center'; ctx.font='12px "Courier New",monospace';
      ctx.fillStyle=`rgba(100,120,160,${Math.max(0,1-(this.wave-1)*0.4)})`;
      ctx.shadowBlur=0;
      ctx.fillText('WASD: move  |  Arrow keys: shoot  |  Mouse: aim & shoot',W/2,H-18);
    }

    // Mute indicator
    if(_muted){
      ctx.textAlign='right'; ctx.font='11px "Courier New",monospace';
      ctx.fillStyle='rgba(220,120,60,0.80)'; ctx.shadowBlur=0;
      ctx.fillText('[M] MUTED',W-18,58);
    }
    ctx.restore();
  }

  drawEventAnnouncement(){
    if(this.eventDisplayTimer<=0 || !this.eventName) return;
    const t=this.eventDisplayTimer;
    // Fade in (0.25s), hold, fade out last 0.6s
    let alpha;
    if(t>3.55)      alpha=(3.8-t)*4.0;        // fade in ~0.25s
    else if(t>0.6)  alpha=1.0;                 // hold
    else            alpha=t/0.6;               // fade out
    alpha=clamp(alpha,0,1);
    // Scale: zoom in from 1.15 → 1.0 then pulse gently
    const zoom=(t>3.2) ? 1.15-(3.8-t)*0.075 : 1+0.04*Math.sin(Date.now()/110);
    const baseSz=Math.round(W*0.055);
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.textAlign='center';
    // Shadow layers for fat neon look
    ctx.font=`bold ${Math.round(baseSz*zoom)}px "Courier New",monospace`;
    ctx.shadowBlur=55; ctx.shadowColor='#ff00aa';
    ctx.fillStyle='#ff44cc';
    ctx.fillText(`-- ${this.eventName} --`, W/2, H*0.46);
    ctx.shadowBlur=20; ctx.shadowColor='#ffffff';
    ctx.fillStyle='#ffffff';
    ctx.globalAlpha=alpha*0.18;
    ctx.fillText(`-- ${this.eventName} --`, W/2+1, H*0.46+1);
    ctx.globalAlpha=1; ctx.restore();
  }

  drawGameOver(){
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.74)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.font='bold 68px "Courier New",monospace';
    ctx.fillStyle='#ff1133'; ctx.shadowColor='#ff0000'; ctx.shadowBlur=35;
    ctx.fillText('GAME OVER',W/2,H/2-60);
    ctx.font='26px "Courier New",monospace';
    ctx.fillStyle='#ddddff'; ctx.shadowColor='#aabbff'; ctx.shadowBlur=14;
    ctx.fillText(`SCORE  ${String(this.score).padStart(9,'0')}`,W/2,H/2+14);
    ctx.fillText(`HI     ${String(this.hi).padStart(9,'0')}`,W/2,H/2+52);
    ctx.font='17px "Courier New",monospace'; ctx.fillStyle='#667799'; ctx.shadowBlur=4;
    ctx.fillText('Click or press SPACE to retry',W/2,H/2+106);
    ctx.restore();
  }

  drawMenu(){
    ctx.save();
    ctx.fillStyle='rgba(0,0,10,0.72)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.font='bold 68px "Courier New",monospace';
    ctx.fillStyle='#ffffff'; ctx.shadowColor='#8888ff'; ctx.shadowBlur=40;
    ctx.fillText('NEON VECTOR',W/2,H/2-90);
    ctx.font='16px "Courier New",monospace'; ctx.shadowColor='#aaaaff'; ctx.shadowBlur=14;
    ctx.fillStyle='#9999cc';
    ctx.fillText('A Geometry Wars-like Shooter',W/2,H/2-52);

    ctx.font='16px "Courier New",monospace'; ctx.shadowBlur=6; ctx.fillStyle='#8899aa';
    ctx.fillText('WASD ── 移動 (自機が向きを変える)',    W/2, H/2-10);
    ctx.fillText('Arrow Keys ── 射撃方向 (移動と独立)',   W/2, H/2+16);
    ctx.fillText('Mouse ── 照準 & クリックで射撃',        W/2, H/2+42);
    ctx.fillText('M ── ミュート / ミュート解除',            W/2, H/2+68);

    const pulse=0.5+0.5*Math.sin(Date.now()/550);
    ctx.font='21px "Courier New",monospace';
    ctx.fillStyle='#ffff88'; ctx.shadowColor='#ffff00'; ctx.shadowBlur=18;
    ctx.globalAlpha=0.5+pulse*0.5;
    ctx.fillText('Click or press any key to start',W/2,H/2+106);
    ctx.globalAlpha=1;
    ctx.restore();
  }

  draw(){
    // ── Afterimage: semi-transparent clear creates motion trails ──
    ctx.fillStyle = (this.state==='menu') ? '#000000' : 'rgba(0,0,0,0.76)';
    ctx.fillRect(0,0,W,H);

    this.drawKillFlash();

    // ── World space ──
    this.grid.draw();
    this.drawWorldBorder();
    for(const b of this.bullets)       b.draw();
    for(const eb of this.enemyBullets) eb.draw();
    for(const e of this.enemies) if(e.alive) e.draw();
    this.player.draw();

    // ── Screen space ──
    drawParticles();
    this.drawBorderVignette();

    // Clear UI strip so afterimage doesn't bleed onto text
    ctx.fillStyle='rgba(0,0,4,0.92)';
    ctx.fillRect(0, 0, W, 68);

    this.drawMinimap();
    this.drawUI();
    if(this.state==='playing'||this.state==='dead') this.drawEventAnnouncement();
    if(this.state==='gameover') this.drawGameOver();
    if(this.state==='menu')     this.drawMenu();
  }
}

// ─── Bootstrap ────────────────────────────────────────────────────────────────
let savedHi=0;
let game=new Game(); game.state='menu';

function startGame(){
  if(game.state==='menu'||game.state==='gameover'){
    _initAudio();
    stopBGM();
    game=new Game();
    // Use promise so BGM starts only after AudioContext is confirmed running
    if(_ac) _ac.resume().then(startBGM).catch(startBGM);
  }
}
window.addEventListener('keydown', e=>{ if(game.state==='menu'||game.state==='gameover') startGame(); });
canvas.addEventListener('click',   ()=>{ if(game.state==='menu'||game.state==='gameover') startGame(); });

// ─── Loop ─────────────────────────────────────────────────────────────────────
let lastT=0;
function loop(ts){
  const dt=Math.min((ts-lastT)/1000, 0.05);
  lastT=ts;
  _resumeAC();
  game.update(dt);
  game.draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(ts=>{ lastT=ts; requestAnimationFrame(loop); });
</script>
